# Egress gateway. Default deny; the filter file is the allowlist.
Port 8888
Listen 0.0.0.0
Timeout 30
LogLevel Warning
MaxClients 20
Allow 0.0.0.0/0          # who may use the proxy (app network only, by topology)
Filter "/etc/tinyproxy/filter"
FilterURLs Off
FilterExtended On
FilterDefaultDeny Yes
ConnectPort 443
DisableViaHeader Yes
