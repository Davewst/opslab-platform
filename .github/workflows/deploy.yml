name: deploy

on:
  repository_dispatch: { types: [app-image-updated] }
  push: { branches: [main] }
  workflow_dispatch:

permissions: { contents: write, packages: read, id-token: write }

concurrency: { group: deploy, cancel-in-progress: false }

jobs:
  pin:
    # Record the new digest in git first. The repo is the source of truth for
    # what should be running; the server is just a place it happens to run.
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
      - name: Verify the signature before trusting the digest
        run: |
          Davewst=$(echo "$GITHUB_REPOSITORY_Davewst" | tr 'A-Z' 'a-z')
          APP="${{ github.event.client_payload.app }}"
          cosign verify "ghcr.io/$Davewst/opslab-$APP@${{ github.event.client_payload.digest }}" \
            --certificate-identity-regexp "^https://github.com/$Davewst/opslab-$APP/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Pin it
        run: |
          Davewst=$(echo "$GITHUB_REPOSITORY_Davewst" | tr 'A-Z' 'a-z')
          APP="${{ github.event.client_payload.app }}"
          KEY=$(echo "$APP" | tr 'a-z-' 'A-Z_')_IMAGE
          sed -i "s|^${KEY}=.*|${KEY}=ghcr.io/$Davewst/opslab-$APP@${{ github.event.client_payload.digest }}|" images.env
          git config user.name  "opslab-bot"
          git config user.email "opslab-bot@users.noreply.github.com"
          git commit -am "pin $APP to ${{ github.event.client_payload.digest }}" || exit 0
          git push

  deploy:
    needs: [pin]
    if: always() && !failure() && !cancelled()
    runs-on: [self-hosted, opslab]     # a runner registered on your server
    environment: production            # add yourself as a required reviewer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { ref: main }
      - run: |
          set -euo pipefail
          cd /opt/opslab
          git pull --ff-only
          set -a; . ./images.env; set +a
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker compose -f deploy/docker-compose.yml pull
          docker compose -f deploy/docker-compose.yml up -d --remove-orphans
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
      - name: Health gate
        run: |
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8088/healthz >/dev/null && \
            curl -fsS http://127.0.0.1:8088/api/health >/dev/null && \
              { echo "healthy"; exit 0; }
            sleep 5
          done
          echo "::error::never became healthy"
          cd /opt/opslab && docker compose -f deploy/docker-compose.yml logs --tail 40
          exit 1
