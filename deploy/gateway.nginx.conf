# The only public surface. Routes by path prefix; the trailing slash on each
# proxy_pass strips the prefix so each app still thinks it lives at /.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;   # the landing page
    index index.html;
    server_tokens off;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /healthz { access_log off; return 200 "ok\n"; }

    location /fleet-shell/ {
        set $u http://fleet-shell:8080/;
        proxy_pass $u;
        include /etc/nginx/proxy-common.conf;
    }
    location /dispatch-lab/ {
        set $u http://dispatch-lab:8080/;
        proxy_pass $u;
        include /etc/nginx/proxy-common.conf;
    }
    location /triage-bench/ {
        set $u http://triage-bench:8080/;
        proxy_pass $u;
        include /etc/nginx/proxy-common.conf;
    }
    location /api/ {
        set $u http://api:8000;
        proxy_pass $u;
        include /etc/nginx/proxy-common.conf;
        client_max_body_size 64k;
    }
    location / { try_files $uri $uri/ =404; }
}
